# PawFit 사용자 앱 — XcodeGen 설정
# .xcodeproj는 이 파일로 만들어요(저장소에는 올리지 않음).
#   brew install xcodegen
#   xcodegen generate
name: PawFit
options:
  bundleIdPrefix: com.advancedswiftly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  postGenCommand: echo "PawFit.xcodeproj 생성 완료"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone만
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  PawFit:
    type: application
    platform: iOS
    sources:
      - path: PawFit
        excludes:
          - "Config/*.xcconfig"
          - "Config/*.example"
    configFiles:
      Debug: PawFit/Config/Debug.xcconfig
      Release: PawFit/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advancedswiftly.pawfit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PawFit/Info.plist
      properties:
        CFBundleDisplayName: PawFit
        CFBundleDevelopmentRegion: ko
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light          # 다크 모드는 검토 중 → 우선 라이트 고정
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        PawFitAPIBaseURL: $(PAWFIT_API_BASE_URL)
        PawFitUseMockAPI: $(PAWFIT_USE_MOCK_API)
        # Debug 빌드에서 localhost 백엔드(http)에 붙을 수 있게. 배포 서버는 https라 영향 없음
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 내 주변에서 반려견과 갈 수 있는 곳을 찾을 때 위치를 써요.
        NSCameraUsageDescription: 예방접종 서류를 찍거나 매장 QR을 읽을 때 카메라를 써요.
        LSApplicationQueriesSchemes: [nmap]   # 네이버 지도 길찾기

  PawFitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PawFitTests]
    dependencies:
      - target: PawFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PawFit:
    build:
      targets:
        PawFit: all
        PawFitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PawFitTests]
